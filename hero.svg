<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Hooded champion in rare late-game armor holding a glowing sword">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#bff0e6" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#bff0e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b46"/>
      <stop offset="1" stop-color="#163a25"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4a31"/>
      <stop offset="1" stop-color="#0e2618"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#c9962f"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9fe9f2"/>
      <stop offset="1" stop-color="#eafcff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g>
    <!-- ground shadow -->
    <ellipse cx="180" cy="522" rx="122" ry="15" fill="#1f2a1f" opacity=".16"/>
    <!-- soft aura behind the hero -->
    <circle cx="180" cy="220" r="172" fill="url(#bgGlow)"/>

    <!-- cape (behind) -->
    <path d="M120,150 C80,250 86,420 60,512 L300,512 C274,420 280,250 240,150 C214,178 146,178 120,150 Z" fill="url(#cape)"/>

    <!-- body silhouette: hood + torso + legs -->
    <path d="M180,52 C212,54 216,92 206,118 L240,150 L232,300 L238,506 L196,506 L191,312 L169,312 L164,506 L122,506 L128,300 L120,150 L154,118 C146,92 148,54 180,52 Z" fill="url(#armor)"/>

    <!-- hood front rim energy glow -->
    <path d="M154,118 C146,92 148,54 180,52 C212,54 216,92 206,118" fill="none" stroke="#7fe9f2" stroke-width="2.5" opacity=".85" filter="url(#glow)"/>

    <!-- gold pauldrons -->
    <ellipse cx="118" cy="152" rx="24" ry="15" fill="url(#gold)"/>
    <ellipse cx="242" cy="152" rx="24" ry="15" fill="url(#gold)"/>

    <!-- glowing chest core -->
    <path d="M180,196 L196,212 L180,228 L164,212 Z" fill="#7fe9f2" filter="url(#glow)"/>

    <!-- shield (viewer-right, lower) -->
    <ellipse cx="266" cy="250" rx="30" ry="40" fill="url(#armor)" stroke="url(#gold)" stroke-width="4"/>
    <path d="M266,232 L258,250 L266,268 L274,250 Z" fill="url(#gold)"/>

    <!-- glowing sword crossing the body (lower-right to upper-left) -->
    <g filter="url(#glow)">
      <polygon points="236,300 226,306 64,62 76,54" fill="url(#blade)"/>
      <polygon points="64,62 76,54 57,44" fill="url(#blade)"/>
      <line x1="214" y1="312" x2="238" y2="294" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
      <line x1="230" y1="300" x2="244" y2="314" stroke="#7a4a1e" stroke-width="6" stroke-linecap="round"/>
      <circle cx="246" cy="316" r="6" fill="url(#gold)"/>
    </g>
  </g>
</svg>
